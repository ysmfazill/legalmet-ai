# Alembic configuration for LEGALMET AI.
#
# The database URL is NOT stored here. It is injected at runtime by
# ``alembic/env.py`` from application settings (the ``LEGALMET_DATABASE_URL`` /
# ``DATABASE_URL`` environment variable), so secrets never live in source and
# migrations run against whatever database the app is configured for.

[alembic]
script_location = alembic
prepend_sys_path = .
# Timestamped, slugged revision filenames keep the history readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
version_path_separator = os
# sqlalchemy.url is intentionally left blank — see alembic/env.py.
sqlalchemy.url =

# Post-write hooks (e.g. `ruff format`) are intentionally omitted so migration
# generation never fails on environments that don't expose the formatter.
# Format generated migrations manually with: ruff format alembic/versions/

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
